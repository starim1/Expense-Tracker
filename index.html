<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0E1613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="장부">
<title>장부 · 가계부</title>
<style>
  :root{
    --bg:#0E1613; --surface:#17211D; --surface2:#1F2C27; --line:#2A3A33;
    --text:#ECF1EE; --muted:#8CA398; --faint:#5E7268;
    --gold:#E4B363; --good:#6FBF9B; --warn:#E8955B; --bad:#E06B5E; --blue:#5B8DEF;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--text);
    font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; touch-action:manipulation; user-select:none; -webkit-user-select:none}
  #app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
    padding-top:var(--safe-top); padding-bottom:calc(78px + var(--safe-bot));}

  .topbar{display:flex; align-items:center; justify-content:center; gap:18px; padding:16px 18px 8px}
  .topbar .mbtn{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--muted);font-size:18px;display:grid;place-items:center}
  .topbar .mbtn:active{background:var(--surface2)}
  .month{font-size:19px; font-weight:700; min-width:118px; text-align:center}
  .month small{display:block; font-size:11px; color:var(--faint); font-weight:500; margin-top:1px}
  .view{padding:6px 16px 20px; flex:1}

  .hero{background:linear-gradient(160deg,var(--surface2),var(--surface)); border-radius:22px; padding:22px 20px 18px; margin-top:4px; position:relative; overflow:hidden}
  .hero .lbl{color:var(--muted); font-size:13px; font-weight:600}
  .hero .amt{font-size:42px; font-weight:800; color:var(--gold); margin:3px 0 3px; line-height:1.05}
  .hero .amt.neg{color:var(--bad)}
  .hero .sub{color:var(--muted); font-size:13px}
  .hero .sub b{font-weight:700}
  .hero .pend{margin-top:11px; font-size:12.5px; color:var(--warn); background:rgba(232,149,91,.1); padding:8px 11px; border-radius:11px}
  .hero .pend b{color:var(--text)}
  .hero .setbal{position:absolute; top:16px; right:16px; font-size:12px; color:var(--muted); background:var(--surface); padding:7px 12px; border-radius:20px; border:1px solid var(--line); font-weight:600}
  .hero .setbal:active{background:var(--surface2)}

  .signals{display:flex; gap:10px; margin-top:14px; overflow-x:auto; scrollbar-width:none; padding:2px}
  .signals::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto; min-width:134px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 13px}
  .pill.tapok:active{opacity:.6}
  .pill .t{font-size:11.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:5px}
  .pill .v{font-size:19px; font-weight:800; margin-top:5px}
  .pill .n{font-size:11px; color:var(--faint); margin-top:2px}
  .pill.alert{border-color:rgba(224,107,94,.4); background:linear-gradient(160deg,rgba(224,107,94,.12),var(--surface))}
  .pill.streak .v{color:var(--warn)}
  .pill.fixed .v{color:var(--blue)}
  .pill.dad .v{color:var(--muted)}

  .sec-h{display:flex; justify-content:space-between; align-items:baseline; margin:26px 4px 10px}
  .sec-h h2{font-size:15px; font-weight:700; margin:0}
  .sec-h a{font-size:12.5px; color:var(--muted); font-weight:600}

  .daygroup{margin-bottom:6px}
  .day-h{display:flex; justify-content:space-between; padding:12px 4px 6px; font-size:12px; color:var(--faint); font-weight:600; position:sticky; top:0; background:var(--bg)}
  .row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line)}
  .row:active{background:var(--surface)}
  .row .ic{width:38px;height:38px;border-radius:11px; display:grid; place-items:center; font-size:18px; background:var(--surface2); flex:0 0 auto; position:relative}
  .row .ic .rec{position:absolute; right:-3px; bottom:-3px; font-size:9px; background:var(--blue); border-radius:50%; width:15px; height:15px; display:grid; place-items:center; border:2px solid var(--bg)}
  .row .mid{flex:1; min-width:0}
  .row .cat{font-size:15px; font-weight:600}
  .row .meta{font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .amt{font-size:16px; font-weight:800}
  .row .amt.inc{color:var(--good)}
  .row .amt.dad{color:var(--muted)}
  .empty{text-align:center; color:var(--faint); padding:46px 20px; font-size:14px; line-height:1.7}
  .empty b{color:var(--muted)}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px}
  .card h3{margin:0 0 14px; font-size:14px; font-weight:700}
  .donut-wrap{display:flex; align-items:center; gap:18px}
  .donut-center{font-size:11px; color:var(--muted); text-align:center}
  .donut-center b{display:block; font-size:20px; color:var(--text); font-weight:800; margin-top:2px}
  .legend{flex:1; display:flex; flex-direction:column; gap:4px; min-width:0}
  .legend .li{display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 6px; border-radius:8px}
  .legend .li:active{background:var(--surface2)}
  .legend .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .legend .ln{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .legend .lp{color:var(--muted); font-size:12px}
  .legend .lv{font-weight:700; font-variant-numeric:tabular-nums}
  .legend .arw{color:var(--faint); font-size:12px}

  .barrow{margin-bottom:13px}
  .barrow.tap:active{opacity:.6}
  .barrow .top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px}
  .barrow .top .r{font-weight:700}
  .track{height:8px; border-radius:8px; background:#0d1512; overflow:hidden}
  .track > span{display:block; height:100%; border-radius:8px}

  .months{display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:8px}
  .months.y{gap:4px}
  .mcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
  .mcol .bar{width:64%; background:var(--surface2); border-radius:6px 6px 2px 2px; transition:height .5s}
  .mcol .bar.cur{background:var(--gold)}
  .mcol .ml{font-size:10px; color:var(--muted)}
  .mcol .mv{font-size:9px; color:var(--faint)}

  .compare{display:flex; gap:12px}
  .compare .box{flex:1; text-align:center; padding:14px 8px; background:var(--surface2); border-radius:14px}
  .compare .box .l{font-size:12px; color:var(--muted)}
  .compare .box .n{font-size:18px; font-weight:800; margin-top:4px}
  .delta{margin-top:12px; text-align:center; font-size:13px; font-weight:600}

  .split{display:flex; height:14px; border-radius:8px; overflow:hidden; margin:2px 0 12px}
  .split > span{display:block; height:100%}
  .split-lg{display:flex; justify-content:space-between; font-size:13px}
  .split-lg .s{display:flex; align-items:center; gap:6px}
  .split-lg .dot{width:9px;height:9px;border-radius:3px}

  .set-group{margin-bottom:22px}
  .set-group > .gh{font-size:13px; color:var(--muted); font-weight:600; margin:0 4px 9px}
  .set-row{display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:8px}
  .set-row .sw{width:6px; height:30px; border-radius:4px; flex:0 0 auto}
  .set-row .name{flex:1; font-weight:600; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .set-row .tag{font-size:11.5px; color:var(--muted); background:var(--surface2); padding:3px 9px; border-radius:20px; flex:0 0 auto}
  .set-row .tag.dad{color:var(--warn)}
  .set-row .x{color:var(--faint); font-size:20px; padding:0 4px; flex:0 0 auto}
  .set-add{width:100%; padding:13px; border:1px dashed var(--line); border-radius:14px; color:var(--muted); font-weight:600; font-size:14px}
  .set-add:active{background:var(--surface)}
  .databtn{display:flex; gap:10px}
  .databtn button{flex:1; padding:13px; border-radius:13px; background:var(--surface2); font-weight:600; font-size:13.5px}
  .danger{color:var(--bad)}

  nav{position:fixed; left:0; right:0; bottom:0; z-index:40; padding-bottom:var(--safe-bot);
    background:rgba(14,22,19,.86); backdrop-filter:blur(14px); border-top:1px solid var(--line)}
  nav .inner{max-width:520px; margin:0 auto; height:64px; display:flex; align-items:center; justify-content:space-around; position:relative}
  nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--faint); font-size:10.5px; font-weight:600; padding:6px 0}
  nav button.on{color:var(--gold)}
  nav .ico{font-size:20px; line-height:1}
  .fab{position:absolute; left:50%; top:-22px; transform:translateX(-50%); width:58px; height:58px; border-radius:50%;
    background:var(--gold); color:#1a1206; font-size:30px; font-weight:300; display:grid; place-items:center;
    box-shadow:0 8px 22px rgba(228,179,99,.4); z-index:2}
  .fab:active{transform:translateX(-50%) scale(.94)}

  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s}
  .sheet-bg.show{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; max-width:520px; margin:0 auto;
    background:var(--surface); border-radius:24px 24px 0 0; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    padding:8px 18px calc(20px + var(--safe-bot)); max-height:94vh; overflow-y:auto}
  .sheet.show{transform:translateY(0)}
  .grip{width:44px; height:5px; background:var(--line); border-radius:4px; margin:8px auto 8px}
  .sheet h3{font-size:16px; margin:6px 2px 14px; text-align:center}

  .segtoggle{display:flex; background:var(--bg); border-radius:12px; padding:4px; margin-bottom:16px}
  .segtoggle button{flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:14px; color:var(--muted)}
  .segtoggle button.on{background:var(--surface2); color:var(--text)}
  .segtoggle button.on.inc{color:var(--good)}

  .amtdisp{text-align:center; font-size:40px; font-weight:800; color:var(--gold); padding:8px 0 4px; min-height:54px; font-variant-numeric:tabular-nums}
  .amtdisp.zero{color:var(--faint)}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
  .chip{padding:9px 13px; border-radius:12px; background:var(--bg); border:1px solid var(--line); font-size:13.5px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:6px}
  .chip.on{background:var(--surface2); color:var(--text); border-color:var(--gold)}
  .flabel{font-size:12px; color:var(--muted); font-weight:600; margin:14px 2px 8px}
  .frow{display:flex; gap:10px; margin-bottom:4px}
  .finput{flex:1; padding:12px 14px; background:var(--bg); border:1px solid var(--line); border-radius:12px; color:var(--text); font-size:15px; outline:none}
  .finput.money{text-align:right; color:var(--gold); font-weight:800; font-variant-numeric:tabular-nums}
  .finput::placeholder{color:var(--faint)}

  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 4px}
  .keypad button{padding:15px 0; background:var(--bg); border-radius:13px; font-size:22px; font-weight:700}
  .keypad button:active{background:var(--surface2)}
  .keypad button.util{font-size:17px; color:var(--muted)}

  .photo-btn{width:100%; padding:12px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); font-weight:600; font-size:14px}
  .photo-btn:active{background:var(--bg)}
  .thumbwrap{position:relative; margin-top:8px}
  .thumb{width:100%; max-height:220px; object-fit:cover; border-radius:12px; display:block}
  .thumb-x{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:#fff; width:30px; height:30px; border-radius:50%; font-size:18px}

  .save-btn{width:100%; padding:16px; background:var(--gold); color:#1a1206; font-size:16px; font-weight:800; border-radius:15px; margin-top:16px}
  .save-btn:active{opacity:.85}
  .save-btn.disabled{background:var(--surface2); color:var(--faint)}
  .del-btn{width:100%; padding:13px; color:var(--bad); font-weight:600; font-size:14px; margin-top:8px}

  .dstat{display:flex; gap:12px; margin:14px 0}
  .dstat .b{flex:1; text-align:center; background:var(--bg); border-radius:12px; padding:12px 6px}
  .dstat .b .l{font-size:11px; color:var(--muted)}
  .dstat .b .n{font-size:16px; font-weight:800; margin-top:3px}

  .filterbar .srch{width:100%; padding:11px 14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; color:var(--text); font-size:14px; outline:none; margin-bottom:10px}
  .fchips{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:1px 0 3px; margin-bottom:8px}
  .fchips::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto; padding:7px 12px; border-radius:20px; background:var(--surface); border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--muted)}
  .fchip.on{background:var(--surface2); color:var(--text); border-color:var(--gold)}

  .emoji-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:5px; max-height:220px; overflow-y:auto; padding:6px; background:var(--bg); border-radius:12px}
  .emoji-grid button{font-size:21px; padding:5px 0; border-radius:9px}
  .emoji-grid button.on{background:var(--surface2)}

  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:90; display:none; align-items:center; justify-content:center; padding:16px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%; max-height:100%; border-radius:10px}

  .banner{background:rgba(228,179,99,.1); border:1px solid rgba(228,179,99,.25); color:var(--gold); font-size:12px; border-radius:12px; padding:10px 13px; margin:0 16px 8px; line-height:1.5}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface2); color:var(--text); padding:11px 18px; border-radius:22px; font-size:13.5px; font-weight:600; z-index:80; opacity:0; transition:all .3s; border:1px solid var(--line); pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><button class="mbtn" id="prevM">‹</button><div class="month" id="monthLbl">—</div><button class="mbtn" id="nextM">›</button></div>
  <div id="banner"></div>
  <div class="view" id="view"></div>
</div>
<nav><div class="inner">
  <button data-tab="home" class="on"><span class="ico">◎</span>홈</button>
  <button data-tab="list"><span class="ico">≣</span>내역</button>
  <div style="flex:1"></div>
  <button data-tab="stats"><span class="ico">◔</span>통계</button>
  <button data-tab="settings"><span class="ico">⚙</span>설정</button>
  <button class="fab" id="fab">+</button>
</div></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="lightbox" id="lightbox"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const store = (() => {
  const KEY='ledger_v1'; let usingLS=true, mem=null;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ usingLS=false; }
  return { load(){ if(usingLS){try{return JSON.parse(localStorage.getItem(KEY))||null;}catch(e){return null;}} return mem; },
    save(d){ if(usingLS){try{localStorage.setItem(KEY,JSON.stringify(d));return;}catch(e){usingLS=false;}} mem=d; },
    get persistent(){return usingLS;} };
})();

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const won=n=>'₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');
const wonS=n=>(n<0?'-':'')+'₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');
const plain=n=>Math.round(n).toLocaleString('ko-KR');
const shortWon=n=>{n=Math.round(n); const s=n<0?'-':''; n=Math.abs(n); if(n>=100000000)return s+(n/100000000).toFixed(1).replace(/\.0$/,'')+'억'; if(n>=10000)return s+(n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'만'; return s+plain(n);};
function localDate(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10);}
const ymOf=ds=>ds.slice(0,7);
function addMonth(ym,delta){const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function daysInMonth(ym){const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate();}
const DOW=['일','월','화','수','목','금','토'];
const CATPAL=['#E4B363','#6FBF9B','#5B8DEF','#E06B5E','#C08CE0','#E8955B','#5FC7C7','#B8C05B','#E07EB0','#8C9BE0','#7FBF6F'];
const EMOJI=['🍚','🍜','🍔','🍕','🍗','🍱','🍣','🥗','🍎','🥦','🥩','🍰','🍩','🍪','☕','🧋','🥤','🍺','🍷','🍹','🛵','🚌','🚕','🚗','⛽','🚇','🚲','✈️','🚄','🅿️','🛍️','👕','👟','👗','💄','🧴','🧻','🛒','🎁','💐','🏠','🛋️','💡','🔧','🧾','📱','💻','🎧','⌚','🔌','📺','🎮','🎬','🎤','🎨','📚','🎫','🎳','🎱','⚽','🏀','🏋️','🏊','🚴','🧘','💊','🏥','🦷','👓','💇','💅','🧖','🐶','🐱','🐟','🦴','🎓','✏️','🖊️','💼','💰','💳','🏦','📈','🪙','🎉','🍾','🕯️','🧸','👶','🚬','🎰','🏨','🏖️','🗺️','⛺','🎿','📦','📮','🔑','🧩','❤️','⭐','🔥','💧','🌱','🎯'];

function defaults(){
  return { version:3, seqCounter:0,
    settings:{ monthlyBudget:0, anchor:{balance:0,seq:0}, balanceSet:false },
    payments:[
      {id:uid(), name:'아빠카드', kind:'card', billingDay:null, mine:false},
      {id:uid(), name:'국민카드', kind:'check', billingDay:null, mine:true},
      {id:uid(), name:'신용카드', kind:'credit', billingDay:10, mine:true},
    ],
    categories:[
      {id:'c_food',name:'식비',icon:'🍚'},{id:'c_cafe',name:'카페/간식',icon:'☕',waste:true},
      {id:'c_deli',name:'배달',icon:'🛵',waste:true},{id:'c_trans',name:'교통',icon:'🚌'},
      {id:'c_shop',name:'쇼핑',icon:'🛍️',waste:true},{id:'c_life',name:'생활',icon:'🧴'},
      {id:'c_cult',name:'문화/여가',icon:'🎮',waste:true},{id:'c_comm',name:'통신',icon:'📱'},
      {id:'c_sub',name:'구독',icon:'📺'},{id:'c_home',name:'주거/공과금',icon:'🏠'},
      {id:'c_med',name:'의료',icon:'💊'},{id:'c_etc',name:'기타',icon:'📦'},
    ],
    incomeCats:[{id:'i_allow',name:'용돈',icon:'💸'},{id:'i_sal',name:'급여',icon:'🪖'},{id:'i_etc',name:'기타수입',icon:'➕'}],
    recurring:[], txns:[] };
}
let state = store.load() || defaults();
migrate();
function migrate(){
  if(!state.recurring) state.recurring=[];
  if(state.seqCounter==null){ state.seqCounter=0; state.txns.forEach(t=>{ if(t.seq==null) t.seq=++state.seqCounter; }); }
  else state.txns.forEach(t=>{ if(t.seq==null) t.seq=++state.seqCounter; });
  if(!state.settings.anchor) state.settings.anchor={balance:0, seq:state.seqCounter};
  if(state.settings.balanceSet==null) state.settings.balanceSet=false;
  state.payments.forEach(p=>{ if(p.mine==null) p.mine=!/아빠/.test(p.name); });
}
let viewMonth=localDate().slice(0,7), tab='home', statsPeriod='month', statsSource='mine';
let listFilter={q:'',scope:'month',type:'all',source:'all',cat:'all'};
function persist(){ store.save(state); }

const catById=id=>state.categories.find(c=>c.id===id)||state.incomeCats.find(c=>c.id===id)||{name:'기타',icon:'📦'};
const payById=id=>state.payments.find(p=>p.id===id)||{name:'-',mine:true};
const catColor=id=>{const i=state.categories.findIndex(c=>c.id===id); return CATPAL[(i<0?0:i)%CATPAL.length];};
const payColor=id=>{const i=state.payments.findIndex(p=>p.id===id); return CATPAL[(i<0?0:i)%CATPAL.length];};
const txnsIn=ym=>state.txns.filter(t=>ymOf(t.date)===ym);
const isMine=t=>payById(t.paymentMethodId).mine!==false;
function inSource(t,src){ const m=isMine(t); return src==='mine'?m:src==='dad'?!m:true; }

/* ===== money model ===== */
function moneyEffect(t){ const pm=payById(t.paymentMethodId); if(pm.mine===false) return 0; if(t.type==='income') return t.amount; if(pm.kind==='credit') return 0; return -t.amount; }
function moneyNow(){ const a=state.settings.anchor; let m=a.balance; state.txns.forEach(t=>{ if(t.seq>a.seq) m+=moneyEffect(t); }); return m; }
function setBalance(x){ state.settings.anchor={balance:x, seq:state.seqCounter}; state.settings.balanceSet=true; persist(); }
function pendingCard(id){ return state.txns.filter(t=>t.type==='expense'&&t.paymentMethodId===id&&!t.settled&&payById(id).kind==='credit'&&payById(id).mine!==false).reduce((s,t)=>s+t.amount,0); }
function pendingTotal(){ return state.payments.filter(p=>p.kind==='credit'&&p.mine!==false).reduce((s,p)=>s+pendingCard(p.id),0); }
function settleCard(id){ const delta=pendingCard(id); state.txns.forEach(t=>{ if(t.type==='expense'&&t.paymentMethodId===id&&!t.settled) t.settled=true; }); state.settings.anchor.balance-=delta; persist(); return delta; }

/* ===== signals ===== */
function myExp(ym){ return txnsIn(ym).filter(t=>t.type==='expense'&&isMine(t)).reduce((s,t)=>s+t.amount,0); }
function dadExp(ym){ return txnsIn(ym).filter(t=>t.type==='expense'&&!isMine(t)).reduce((s,t)=>s+t.amount,0); }
function incMonth(ym){ return txnsIn(ym).filter(t=>t.type==='income'&&isMine(t)).reduce((s,t)=>s+t.amount,0); }
function noSpendStreak(){ const exp=new Set(state.txns.filter(t=>t.type==='expense').map(t=>t.date)); let s=0,d=new Date(); while(s<400){ if(exp.has(localDate(d)))break; s++; d.setDate(d.getDate()-1);} return s; }
function noSpendThisMonth(ym){ const exp=new Set(txnsIn(ym).filter(t=>t.type==='expense').map(t=>t.date)); const cur=ym===localDate().slice(0,7); const days=cur?new Date().getDate():daysInMonth(ym); let c=0; for(let i=1;i<=days;i++){ if(!exp.has(ym+'-'+String(i).padStart(2,'0')))c++; } return c; }
function wasteWatch(ym){ const wc=new Set(state.categories.filter(c=>c.waste).map(c=>c.id)); const f=t=>t.type==='expense'&&wc.has(t.categoryId)&&isMine(t); const cur=txnsIn(ym).filter(f).reduce((s,t)=>s+t.amount,0); const dim=daysInMonth(ym),isc=ym===localDate().slice(0,7); const el=isc?new Date().getDate():dim; const proj=el>0?cur/el*dim:cur; let sums=[],mm=ym; for(let i=0;i<3;i++){mm=addMonth(mm,-1); if(txnsIn(mm).length) sums.push(txnsIn(mm).filter(f).reduce((s,t)=>s+t.amount,0));} const avg=sums.length?sums.reduce((a,b)=>a+b,0)/sums.length:null; return {cur,proj,avg,over:avg!=null&&proj>avg*1.15}; }

/* ===== shell ===== */
function render(){
  const [y,m]=viewMonth.split('-');
  if(tab==='stats'&&statsPeriod==='year') $('#monthLbl').innerHTML=`${y}년<small>연간</small>`;
  else $('#monthLbl').innerHTML=`${Number(m)}월<small>${y}년</small>`;
  $$('nav button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#banner').innerHTML=store.persistent?'':`<div class="banner">지금은 미리보기라 새로고침하면 데이터가 사라져요. 배포하거나 파일로 열면 저장됩니다.</div>`;
  const v=$('#view');
  v.innerHTML = tab==='home'?viewHome():tab==='list'?viewList():tab==='stats'?viewStats():viewSettings();
  wire();
}

/* ===== home ===== */
function viewHome(){
  const money=moneyNow(), pend=pendingTotal();
  const mE=myExp(viewMonth), dE=dadExp(viewMonth), inc=incMonth(viewMonth);
  const streak=noSpendStreak(), nsM=noSpendThisMonth(viewMonth), ww=wasteWatch(viewMonth);
  const recActive=state.recurring.filter(r=>r.active), recTotal=recActive.reduce((s,r)=>s+r.amount,0);
  const budget=state.settings.monthlyBudget||0;

  let sig='';
  sig+=`<div class="pill"><div class="t">↓ 이번 달 내 지출</div><div class="v num">${won(mE)}</div><div class="n">${state.settings.balanceSet?'내 돈에서 나간 것':'수입 대비'}</div></div>`;

  if(ww.over) sig+=`<div class="pill alert"><div class="t">⚠ 낭비 경보</div><div class="v num">${won(ww.proj)}</div><div class="n">이 속도면 예상 · 평소 ${shortWon(ww.avg)}원</div></div>`;
  if(recActive.length) sig+=`<div class="pill fixed tapok" data-goto="settings"><div class="t">🔁 고정비</div><div class="v num">${won(recTotal)}</div><div class="n">매달 ${recActive.length}건</div></div>`;
  sig+=`<div class="pill streak"><div class="t">🔥 무지출 연속</div><div class="v num">${streak}일</div><div class="n">이달 무지출 ${nsM}일</div></div>`;
  state.payments.filter(p=>p.kind==='credit'&&p.mine!==false).forEach(p=>{ const pc=pendingCard(p.id); sig+=`<div class="pill tapok" data-settle="${p.id}"><div class="t">💳 ${esc(p.name)}</div><div class="v num">${won(pc)}</div><div class="n">${p.billingDay?'매달 '+p.billingDay+'일':''} · 탭해서 결제완료</div></div>`; });

  if(budget>0){ const pct=Math.min(mE/budget*100,100); sig+=`<div class="pill"><div class="t">🎯 예산</div><div class="v num">${Math.round(mE/budget*100)}%</div><div class="n">${shortWon(mE)} / ${shortWon(budget)}</div></div>`; }

  const recent=txnsIn(viewMonth).sort((a,b)=>b.seq-a.seq).slice(0,6);
  const recentHtml=recent.length?recent.map(rowHtml).join(''):`<div class="empty">아직 기록이 없어요.<br><b>아래 + 버튼</b>으로 첫 지출을 남겨보세요.</div>`;

  return `
  <div class="hero">

    <div class="amt num ${money<0?'neg':''}">${wonS(money)}</div>
    <div class="sub">이번 달 내 지출 <b style="color:var(--text)">−${plain(mE)}</b>${inc>0?` · 수입 <b style="color:var(--good)">+${plain(inc)}</b>`:''}</div>
    ${pend>0?`<div class="pend">💳 카드값 <b>${won(pend)}</b> 빠지면 → 실사용 가능 <b>${wonS(money-pend)}</b></div>`:''}
    ${!state.settings.balanceSet?`<div class="pend" style="color:var(--gold);background:rgba(228,179,99,.1)">오른쪽 위 <b>잔액 맞추기</b>로 지금 가진 돈을 입력하면 정확해져요.</div>`:''}
  </div>

  <div class="sec-h"><h2>최근 내역</h2><a data-goto="list">전체 보기</a></div>

}

    <div class="amt ${cls} num">${t.type==='income'?'+':'−'}${plain(t.amount)}</div></div>`;
}

/* ===== list (detailed + filters) ===== */
function viewList(){

  let arr=base.filter(t=>{
    if(listFilter.type!=='all'&&t.type!==listFilter.type) return false;

      <button class="fchip ${listFilter.source==='dad'?'on':''}" data-fsrc="dad">아빠카드</button>

/* ===== stats ===== */
function expBy(ym,src,keyFn){ const o={}; txnsIn(ym).filter(t=>t.type==='expense'&&inSource(t,src)).forEach(t=>{const k=keyFn(t); o[k]=(o[k]||0)+t.amount;}); return o; }
function expSum(ym,src){ return txnsIn(ym).filter(t=>t.type==='expense'&&inSource(t,src)).reduce((s,t)=>s+t.amount,0); }
function srcToggle(){ return `<div class="fchips" style="margin-bottom:14px">
  <button class="fchip ${statsSource==='mine'?'on':''}" data-ssrc="mine">내 지출</button>
  <button class="fchip ${statsSource==='dad'?'on':''}" data-ssrc="dad">아빠카드</button>
  <button class="fchip ${statsSource==='all'?'on':''}" data-ssrc="all">전체</button></div>`; }
function statToggle(){ return `<div class="segtoggle"><button class="${statsPeriod==='month'?'on':''}" data-sp="month">월간</button><button class="${statsPeriod==='year'?'on':''}" data-sp="year">연간</button></div>`; }
function viewStats(){ return statToggle()+srcToggle()+(statsPeriod==='year'?viewStatsYear():viewStatsMonth()); }

function viewStatsMonth(){
  const exp=expSum(viewMonth,statsSource);
  if(exp===0) return `<div class="empty">이 달은 해당 지출 기록이 없어요.</div>`;
  const arr=txnsIn(viewMonth).filter(t=>t.type==='expense'&&inSource(t,statsSource));
  const dim=daysInMonth(viewMonth), isc=viewMonth===localDate().slice(0,7), el=isc?new Date().getDate():dim;
  const biggest=arr.slice().sort((a,b)=>b.amount-a.amount)[0];
  const summary=`<div class="card"><h3>요약</h3><div class="dstat" style="margin:0">
    <div class="b"><div class="l">총 지출</div><div class="n num">${shortWon(exp)}</div></div>
    <div class="b"><div class="l">일 평균</div><div class="n num">${shortWon(exp/Math.max(el,1))}</div></div>
    <div class="b"><div class="l">건수</div><div class="n num">${arr.length}</div></div>
    <div class="b"><div class="l">최고</div><div class="n num">${shortWon(biggest?biggest.amount:0)}</div></div></div></div>`;

  const byCat=expBy(viewMonth,statsSource,t=>t.categoryId);

  const donut=donutSVG(catArr.map(x=>({v:x.v,col:x.col})),exp);

  const fvCard=fixed>0?`<div class="card"><h3>고정비 / 변동비</h3><div class="split"><span style="width:${fixed/exp*100}%;background:var(--blue)"></span><span style="width:${variable/exp*100}%;background:var(--gold)"></span></div><div class="split-lg"><span class="s"><span class="dot" style="background:var(--blue)"></span>고정 <b class="num">${won(fixed)}</b></span><span class="s"><span class="dot" style="background:var(--gold)"></span>변동 <b class="num">${won(variable)}</b></span></div></div>`:'';

  const byPay=expBy(viewMonth,statsSource,t=>t.paymentMethodId);

  let months=[],mm=viewMonth; for(let i=0;i<6;i++){months.unshift({ym:mm,v:expSum(mm,statsSource)}); mm=addMonth(mm,-1);}

  const year=viewMonth.slice(0,4);

  const maxC=Math.max(...catArr.map(x=>x.v),1);
  const catBars=catArr.map(x=>`<div class="barrow tap" data-catdetail="${x.id}"><div class="top"><span>${x.c.icon||''} ${esc(x.c.name)} <span style="color:var(--muted)">${Math.round(x.v/yExp*100)}%</span></span><span class="r num">${won(x.v)}</span></div><div class="track"><span style="width:${x.v/maxC*100}%;background:${x.col}"></span></div></div>`).join('');
  const fixed=yt.filter(t=>t.recurringId).reduce((s,t)=>s+t.amount,0), variable=yExp-fixed;

function donutSVG(segs,total){
  const r=52,C=2*Math.PI*r,cx=64,cy=64; let off=0;
  const circles=segs.map(s=>{const frac=s.v/total,dash=frac*C; const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}" stroke-width="20" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`; off+=dash; return el;}).join('');
  return `<div style="position:relative;width:128px;height:128px;flex:0 0 auto"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0d1512" stroke-width="20"/>${circles}</svg><div style="position:absolute;inset:0;display:grid;place-items:center"><div class="donut-center">총 지출<b class="num">${shortWon(total)}</b></div></div></div>`;
}

function pickPhoto(cb){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{const img=new Image(); img.onload=()=>{const max=900; let w=img.width,h=img.height; if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;} const cv=document.createElement('canvas'); cv.width=w;cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); cb(cv.toDataURL('image/jpeg',0.55));}; img.src=r.result;}; r.readAsDataURL(f);}; i.click(); }

    ${isEdit?`<button class="del-btn" id="delTxn">삭제</button>`:''}`;

function wireSheet(isEdit){
  const sh=$('#sheet');
  $$('[data-type]',sh).forEach(b=>b.onclick=()=>{draft.type=b.dataset.type; renderSheet(isEdit);});
  $$('[data-k]',sh).forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; let s=String(Math.round(draft.amount||0));
    if(k==='del') s=s.length>1?s.slice(0,-1):'0';
    else if(k==='000') s=(s==='0'?'0':s+'000');
    else s=(s==='0'?k:s+k);
    if(s.length>13) return;
    draft.amount=Number(s);
    const disp=$('.amtdisp',sh); disp.textContent=draft.amount?(draft.type==='income'?'+':'')+won(draft.amount):'₩0'; disp.classList.toggle('zero',!draft.amount);
    $('#saveTxn').classList.toggle('disabled',!(draft.amount>0));
  });
  $$('[data-cat]',sh).forEach(b=>b.onclick=()=>{draft.categoryId=b.dataset.cat; renderSheet(isEdit);});
  $$('[data-pay]',sh).forEach(b=>b.onclick=()=>{draft.paymentMethodId=b.dataset.pay; renderSheet(isEdit);});
  $('#dateIn',sh).onchange=e=>draft.date=e.target.value;
  $('#memoIn',sh).oninput=e=>draft.memo=e.target.value;
  const ap=$('#addPhoto',sh); if(ap) ap.onclick=()=>pickPhoto(d=>{draft.photo=d; renderSheet(isEdit);});
  const rp=$('#rmPhoto',sh); if(rp) rp.onclick=()=>{draft.photo=null; renderSheet(isEdit);};
  const th=$('#thumb',sh); if(th) th.onclick=()=>showLightbox(draft.photo);
  $('#saveTxn').onclick=()=>{
    if(!(draft.amount>0)) return;
    draft.memo=($('#memoIn',sh).value||'').trim();
    const i=state.txns.findIndex(t=>t.id===draft.id);
    if(i>=0){ draft.seq=state.txns[i].seq; state.txns[i]=draft; }
    else { draft.seq=++state.seqCounter; if(payById(draft.paymentMethodId).kind==='credit') draft.settled=false; state.txns.push(draft); }
    persist(); closeSheet(); render(); toast(isEdit?'수정했어요':'저장했어요');
  };
  if(isEdit) $('#delTxn').onclick=()=>{ state.txns=state.txns.filter(t=>t.id!==draft.id); persist(); closeSheet(); render(); toast('삭제했어요'); };
}

function postRecurring(){

  const cats=state.categories.map(c=>`<div class="set-row"><div style="width:34px;height:34px;background:var(--surface2);border-radius:9px;display:grid;place-items:center;flex:0 0 auto">${c.icon||'📦'}</div><div class="name">${esc(c.name)}</div>${c.waste?'<span class="tag">낭비추적</span>':''}<button class="x" data-editcat="${c.id}">✎</button><button class="x" data-delcat="${c.id}">×</button></div>`).join('');
  return `
  <div class="set-group"><div class="gh">현재 잔액</div>
    <div class="set-row"><div class="name">남은 돈</div><span class="tag num" style="font-size:15px;color:var(--gold)">${wonS(moneyNow())}</span><button class="x" id="setBal2" style="font-size:14px;color:var(--gold)">맞추기</button></div>
    <div style="color:var(--faint);font-size:11.5px;margin:2px 6px">내 돈 결제수단의 지출·수입이 여기서 자동 오르내려요.</div></div>
  <div class="set-group"><div class="gh">반복지출 (고정비)</div>${recs}<button class="set-add" id="addRec">+ 반복지출 추가</button></div>
  <div class="set-group"><div class="gh">결제수단</div>${pays}<button class="set-add" id="addPay">+ 결제수단 추가</button></div>
  <div class="set-group"><div class="gh">월 예산 (선택)</div>
    <div class="set-row"><span style="color:var(--muted)">₩</span><input id="budgetIn" type="text" inputmode="numeric" value="${state.settings.monthlyBudget?plain(state.settings.monthlyBudget):''}" placeholder="설정 안 함" style="flex:1;background:none;border:none;color:var(--gold);font-size:18px;font-weight:800;text-align:right;outline:none" class="num"></div></div>
  <div class="set-group"><div class="gh">지출 카테고리</div>${cats}<button class="set-add" id="addCat">+ 카테고리 추가</button></div>
  <div class="set-group"><div class="gh">데이터</div><div class="databtn"><button id="exportBtn">내보내기 (백업)</button><button id="importBtn">가져오기</button></div><div style="margin-top:8px"><button class="set-add danger" id="resetBtn" style="border-color:rgba(224,107,94,.3)">전체 초기화</button></div></div>
  <div style="text-align:center;color:var(--faint);font-size:11.5px;margin-top:18px">${store.persistent?'데이터는 이 기기에만 저장됩니다.':'미리보기 모드 · 배포 후 저장'}<br>정기적으로 내보내기로 백업하세요.</div>`;
}

/* ===== data ===== */
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`장부백업_${localDate()}.json`; a.click(); URL.revokeObjectURL(a.href); toast('백업 파일을 저장했어요'); }
function importData(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.txns||!d.payments)throw 0; state=d; migrate(); persist(); render(); toast('데이터를 불러왔어요');}catch(_){toast('올바른 백업 파일이 아니에요');}}; r.readAsText(f);}; inp.click(); }

/* ===== wiring ===== */
function wire(){
  $$('[data-goto]').forEach(a=>a.onclick=()=>{tab=a.dataset.goto; render();});
  $$('[data-edit]').forEach(r=>r.onclick=()=>openSheet(r.dataset.edit));
  $$('[data-settle]').forEach(el=>el.onclick=()=>{const id=el.dataset.settle,pc=pendingCard(id); if(pc<=0){toast('결제할 카드값이 없어요');return;} if(confirm(`${payById(id).name} 카드값 ${won(pc)}을 결제 완료 처리할까요?\n남은 돈에서 차감됩니다.`)){settleCard(id); render(); toast('카드값 결제 처리했어요');}});
  const sb=$('#setBal'); if(sb) sb.onclick=balanceSheet;
  $$('[data-sp]').forEach(b=>b.onclick=()=>{statsPeriod=b.dataset.sp; render();});
  $$('[data-ssrc]').forEach(b=>b.onclick=()=>{statsSource=b.dataset.ssrc; render();});
  $$('[data-catdetail]').forEach(el=>el.onclick=()=>categoryDetailSheet(el.dataset.catdetail));
  if(tab==='list'){
    const s=$('#srch'); if(s){ s.oninput=e=>{listFilter.q=e.target.value; const p=e.target.selectionStart; render(); const ns=$('#srch'); if(ns){ns.focus(); try{ns.setSelectionRange(p,p);}catch(_){}}}; }
    $$('[data-fscope]').forEach(b=>b.onclick=()=>{listFilter.scope=b.dataset.fscope; render();});
    $$('[data-ftype]').forEach(b=>b.onclick=()=>{listFilter.type=b.dataset.ftype; render();});
    $$('[data-fsrc]').forEach(b=>b.onclick=()=>{listFilter.source=b.dataset.fsrc; render();});
    $$('[data-fcat]').forEach(b=>b.onclick=()=>{listFilter.cat=b.dataset.fcat; render();});
  }
  if(tab==='settings'){
    const sb2=$('#setBal2'); if(sb2) sb2.onclick=balanceSheet;
    $('#budgetIn').oninput=e=>{let v=e.target.value.replace(/[^\d]/g,''); e.target.value=v?Number(v).toLocaleString('ko-KR'):''; state.settings.monthlyBudget=Number(v)||0; persist();};
    $('#addRec').onclick=()=>recFormSheet(null);
    $$('[data-editrec]').forEach(b=>b.onclick=()=>recFormSheet(b.dataset.editrec));
    $$('[data-delrec]').forEach(b=>b.onclick=()=>{if(confirm('이 반복지출을 삭제할까요?')){state.recurring=state.recurring.filter(r=>r.id!==b.dataset.delrec); persist(); render();}});
    $$('[data-togrec]').forEach(b=>b.onclick=()=>{const r=state.recurring.find(x=>x.id===b.dataset.togrec); if(r){r.active=!r.active; if(r.active)postRecurring(); persist(); render();}});
    $('#addPay').onclick=()=>payFormSheet(null);
    $$('[data-editpay]').forEach(b=>b.onclick=()=>payFormSheet(b.dataset.editpay));
    $$('[data-delpay]').forEach(b=>b.onclick=()=>{if(confirm('이 결제수단을 삭제할까요? 기존 내역은 유지됩니다.')){state.payments=state.payments.filter(p=>p.id!==b.dataset.delpay); persist(); render();}});
    $('#addCat').onclick=()=>catFormSheet(null);
    $$('[data-editcat]').forEach(b=>b.onclick=()=>catFormSheet(b.dataset.editcat));
    $$('[data-delcat]').forEach(b=>b.onclick=()=>{if(confirm('이 카테고리를 삭제할까요?')){state.categories=state.categories.filter(c=>c.id!==b.dataset.delcat); persist(); render();}});
    $('#exportBtn').onclick=exportData; $('#importBtn').onclick=importData;
    $('#resetBtn').onclick=()=>{if(confirm('모든 데이터를 지우고 처음 상태로 되돌립니다. 계속할까요?')){state=defaults(); persist(); render();}};
  }
}
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

$$('nav button[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab; if(tab!=='stats')statsPeriod='month'; render();});
$('#fab').onclick=()=>openSheet(null);
function step(dir){ if(tab==='stats'&&statsPeriod==='year') viewMonth=addMonth(viewMonth,dir*12); else viewMonth=addMonth(viewMonth,dir); render(); }
$('#prevM').onclick=()=>step(-1); $('#nextM').onclick=()=>step(1);
$('#sheetBg').onclick=closeSheet;
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('show');

/* swipe-down to close sheet */
(function(){ const sh=$('#sheet'); let drag=false,y0=0;
  sh.addEventListener('touchstart',e=>{const r=sh.getBoundingClientRect(); const y=e.touches[0].clientY; if(y-r.top<72 && sh.scrollTop<=0){drag=true; y0=y; sh.style.transition='none';} else drag=false;},{passive:true});
  sh.addEventListener('touchmove',e=>{if(!drag)return; const dy=e.touches[0].clientY-y0; if(dy>0) sh.style.transform='translateY('+dy+'px)';},{passive:true});
  sh.addEventListener('touchend',e=>{if(!drag)return; drag=false; sh.style.transition=''; const dy=e.changedTouches[0].clientY-y0; if(dy>90) closeSheet(); else sh.style.transform='';});
})();

/* icon + manifest */
(function(){
  function icon(size){ const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'); x.fillStyle='#0E1613'; x.fillRect(0,0,size,size); x.fillStyle='#1F2C27'; const pad=size*0.14,r=size*0.22; roundRect(x,pad,pad,size-2*pad,size-2*pad,r); x.fill(); x.fillStyle='#E4B363'; x.textAlign='center'; x.textBaseline='middle'; x.font='800 '+Math.round(size*0.5)+'px -apple-system,Segoe UI,Roboto,sans-serif'; x.fillText('₩',size/2,size*0.56); return c.toDataURL('image/png'); }
  function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
  try{
    const i180=icon(180), i512=icon(512);
    const a1=document.createElement('link'); a1.rel='apple-touch-icon'; a1.href=i180; document.head.appendChild(a1);
    const a2=document.createElement('link'); a2.rel='icon'; a2.href=i180; document.head.appendChild(a2);
    const mani={name:'장부 가계부',short_name:'장부',display:'standalone',background_color:'#0E1613',theme_color:'#0E1613',start_url:'.',icons:[{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'},{src:i180,sizes:'180x180',type:'image/png'}]};
    const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(mani)],{type:'application/json'})); document.head.appendChild(l);
  }catch(e){}
})();

const autoPosted=postRecurring();
render();
if(autoPosted) toast(`고정비 ${autoPosted}건 자동 등록됨`);
</script>
</body>
</html>
