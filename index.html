<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0E1613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="장부">
<title>장부 · 가계부</title>
<style>
  :root{
    --bg:#0E1613; --surface:#17211D; --surface2:#1F2C27; --line:#2A3A33;
    --text:#ECF1EE; --muted:#8CA398; --faint:#5E7268;
    --gold:#E4B363; --good:#6FBF9B; --warn:#E8955B; --bad:#E06B5E; --blue:#5B8DEF;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  #app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
    padding-top:var(--safe-top); padding-bottom:calc(78px + var(--safe-bot));}
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none}

  .topbar{display:flex; align-items:center; justify-content:center; gap:18px; padding:16px 18px 8px}
  .topbar .mbtn{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--muted);font-size:18px;display:grid;place-items:center}
  .topbar .mbtn:active{background:var(--surface2)}
  .month{font-size:19px; font-weight:700; min-width:118px; text-align:center}
  .month small{display:block; font-size:11px; color:var(--faint); font-weight:500; margin-top:1px}

  .view{padding:6px 16px 20px; flex:1}

  .hero{background:linear-gradient(160deg,var(--surface2),var(--surface)); border-radius:22px; padding:22px 20px 20px; margin-top:4px; position:relative; overflow:hidden}
  .hero .lbl{color:var(--muted); font-size:13px; font-weight:600}
  .hero .amt{font-size:42px; font-weight:800; color:var(--gold); margin:2px 0 2px; line-height:1.05}
  .hero .sub{color:var(--muted); font-size:13px}
  .hero .sub b{color:var(--text); font-weight:700}
  .gauge{height:9px; border-radius:9px; background:#0d1512; margin:16px 0 8px; overflow:hidden}
  .gauge > span{display:block; height:100%; border-radius:9px; transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .pace{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--muted)}
  .pace b{font-size:16px; font-weight:800}

  .signals{display:flex; gap:10px; margin-top:14px; overflow-x:auto; scrollbar-width:none; padding:2px}
  .signals::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto; min-width:132px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 13px}
  .pill .t{font-size:11.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:5px}
  .pill .v{font-size:19px; font-weight:800; margin-top:5px}
  .pill .n{font-size:11px; color:var(--faint); margin-top:2px}
  .pill.alert{border-color:rgba(224,107,94,.4); background:linear-gradient(160deg,rgba(224,107,94,.12),var(--surface))}
  .pill.streak .v{color:var(--warn)}
  .pill.fixed .v{color:var(--blue)}

  .sec-h{display:flex; justify-content:space-between; align-items:baseline; margin:26px 4px 10px}
  .sec-h h2{font-size:15px; font-weight:700; margin:0}
  .sec-h a{font-size:12.5px; color:var(--muted); font-weight:600}

  .daygroup{margin-bottom:6px}
  .day-h{display:flex; justify-content:space-between; padding:12px 4px 6px; font-size:12px; color:var(--faint); font-weight:600; position:sticky; top:0; background:var(--bg)}
  .row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line)}
  .row:active{background:var(--surface)}
  .row .ic{width:38px;height:38px;border-radius:11px; display:grid; place-items:center; font-size:18px; background:var(--surface2); flex:0 0 auto; position:relative}
  .row .ic .rec{position:absolute; right:-3px; bottom:-3px; font-size:10px; background:var(--blue); border-radius:50%; width:15px; height:15px; display:grid; place-items:center; border:2px solid var(--bg)}
  .row .mid{flex:1; min-width:0}
  .row .cat{font-size:15px; font-weight:600}
  .row .meta{font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .amt{font-size:16px; font-weight:800}
  .row .amt.inc{color:var(--good)}

  .empty{text-align:center; color:var(--faint); padding:46px 20px; font-size:14px; line-height:1.7}
  .empty b{color:var(--muted)}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px}
  .card h3{margin:0 0 14px; font-size:14px; font-weight:700}
  .donut-wrap{display:flex; align-items:center; gap:18px}
  .donut-center{font-size:11px; color:var(--muted); text-align:center}
  .donut-center b{display:block; font-size:20px; color:var(--text); font-weight:800; margin-top:2px}
  .legend{flex:1; display:flex; flex-direction:column; gap:4px; min-width:0}
  .legend .li{display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 6px; border-radius:8px}
  .legend .li:active{background:var(--surface2)}
  .legend .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .legend .ln{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .legend .lp{color:var(--muted); font-size:12px}
  .legend .lv{font-weight:700; font-variant-numeric:tabular-nums}
  .legend .arw{color:var(--faint); font-size:12px}

  .barrow{margin-bottom:13px}
  .barrow.tap:active{opacity:.6}
  .barrow .top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px}
  .barrow .top .r{font-weight:700}
  .track{height:8px; border-radius:8px; background:#0d1512; overflow:hidden}
  .track > span{display:block; height:100%; border-radius:8px}

  .months{display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:8px}
  .months.y{gap:4px}
  .mcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
  .mcol .bar{width:64%; background:var(--surface2); border-radius:6px 6px 2px 2px; transition:height .5s}
  .mcol .bar.cur{background:var(--gold)}
  .mcol .ml{font-size:10px; color:var(--muted)}
  .mcol .mv{font-size:9px; color:var(--faint)}

  .compare{display:flex; gap:12px}
  .compare .box{flex:1; text-align:center; padding:14px 8px; background:var(--surface2); border-radius:14px}
  .compare .box .l{font-size:12px; color:var(--muted)}
  .compare .box .n{font-size:18px; font-weight:800; margin-top:4px}
  .delta{margin-top:12px; text-align:center; font-size:13px; font-weight:600}

  .split{display:flex; height:14px; border-radius:8px; overflow:hidden; margin:2px 0 12px}
  .split > span{display:block; height:100%}
  .split-lg{display:flex; justify-content:space-between; font-size:13px}
  .split-lg .s{display:flex; align-items:center; gap:6px}
  .split-lg .dot{width:9px;height:9px;border-radius:3px}

  .set-group{margin-bottom:22px}
  .set-group > .gh{font-size:13px; color:var(--muted); font-weight:600; margin:0 4px 9px}
  .set-row{display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:8px}
  .set-row .sw{width:6px; height:30px; border-radius:4px; flex:0 0 auto}
  .set-row .name{flex:1; font-weight:600; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .set-row .tag{font-size:11.5px; color:var(--muted); background:var(--surface2); padding:3px 9px; border-radius:20px; flex:0 0 auto}
  .set-row .x{color:var(--faint); font-size:20px; padding:0 4px; flex:0 0 auto}
  .set-add{width:100%; padding:13px; border:1px dashed var(--line); border-radius:14px; color:var(--muted); font-weight:600; font-size:14px}
  .set-add:active{background:var(--surface)}
  .budget-in{display:flex; align-items:center; gap:8px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px}
  .budget-in input{flex:1; background:none; border:none; color:var(--gold); font-size:22px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; outline:none; min-width:0}
  .databtn{display:flex; gap:10px}
  .databtn button{flex:1; padding:13px; border-radius:13px; background:var(--surface2); font-weight:600; font-size:13.5px}
  .danger{color:var(--bad)}

  nav{position:fixed; left:0; right:0; bottom:0; z-index:40; padding-bottom:var(--safe-bot);
    background:rgba(14,22,19,.86); backdrop-filter:blur(14px); border-top:1px solid var(--line)}
  nav .inner{max-width:520px; margin:0 auto; height:64px; display:flex; align-items:center; justify-content:space-around; position:relative}
  nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--faint); font-size:10.5px; font-weight:600; padding:6px 0}
  nav button.on{color:var(--gold)}
  nav .ico{font-size:20px; line-height:1}
  .fab{position:absolute; left:50%; top:-22px; transform:translateX(-50%); width:58px; height:58px; border-radius:50%;
    background:var(--gold); color:#1a1206; font-size:30px; font-weight:300; display:grid; place-items:center;
    box-shadow:0 8px 22px rgba(228,179,99,.4); z-index:2}
  .fab:active{transform:translateX(-50%) scale(.94)}

  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s}
  .sheet-bg.show{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; max-width:520px; margin:0 auto;
    background:var(--surface); border-radius:24px 24px 0 0; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    padding:8px 18px calc(20px + var(--safe-bot)); max-height:94vh; overflow-y:auto}
  .sheet.show{transform:translateY(0)}
  .grip{width:38px; height:4px; background:var(--line); border-radius:4px; margin:8px auto 6px}
  .sheet h3{font-size:16px; margin:6px 2px 14px; text-align:center}

  .segtoggle{display:flex; background:var(--bg); border-radius:12px; padding:4px; margin-bottom:16px}
  .segtoggle button{flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:14px; color:var(--muted)}
  .segtoggle button.on{background:var(--surface2); color:var(--text)}
  .segtoggle button.on.inc{color:var(--good)}

  .amtdisp{text-align:center; font-size:40px; font-weight:800; color:var(--gold); padding:10px 0 6px; min-height:56px; font-variant-numeric:tabular-nums}
  .amtdisp.zero{color:var(--faint)}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
  .chip{padding:9px 13px; border-radius:12px; background:var(--bg); border:1px solid var(--line); font-size:13.5px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:6px}
  .chip.on{background:var(--surface2); color:var(--text); border-color:var(--gold)}
  .flabel{font-size:12px; color:var(--muted); font-weight:600; margin:14px 2px 8px}
  .frow{display:flex; gap:10px; margin-bottom:4px}
  .finput{flex:1; padding:12px 14px; background:var(--bg); border:1px solid var(--line); border-radius:12px; color:var(--text); font-size:15px; outline:none}
  .finput.money{text-align:right; color:var(--gold); font-weight:800; font-variant-numeric:tabular-nums}
  .finput::placeholder{color:var(--faint)}

  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 4px}
  .keypad button{padding:16px 0; background:var(--bg); border-radius:13px; font-size:22px; font-weight:700}
  .keypad button:active{background:var(--surface2)}
  .keypad button.util{font-size:17px; color:var(--muted)}

  .save-btn{width:100%; padding:16px; background:var(--gold); color:#1a1206; font-size:16px; font-weight:800; border-radius:15px; margin-top:16px}
  .save-btn:active{opacity:.85}
  .save-btn.disabled{background:var(--surface2); color:var(--faint)}
  .del-btn{width:100%; padding:13px; color:var(--bad); font-weight:600; font-size:14px; margin-top:8px}

  .dstat{display:flex; gap:12px; margin:14px 0}
  .dstat .b{flex:1; text-align:center; background:var(--bg); border-radius:12px; padding:12px 6px}
  .dstat .b .l{font-size:11px; color:var(--muted)}
  .dstat .b .n{font-size:16px; font-weight:800; margin-top:3px}

  .banner{background:rgba(228,179,99,.1); border:1px solid rgba(228,179,99,.25); color:var(--gold); font-size:12px; border-radius:12px; padding:10px 13px; margin:0 16px 8px; line-height:1.5}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface2); color:var(--text); padding:11px 18px; border-radius:22px; font-size:13.5px; font-weight:600; z-index:80; opacity:0; transition:all .3s; border:1px solid var(--line); pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="mbtn" id="prevM">‹</button>
    <div class="month" id="monthLbl">—</div>
    <button class="mbtn" id="nextM">›</button>
  </div>
  <div id="banner"></div>
  <div class="view" id="view"></div>
</div>

<nav>
  <div class="inner">
    <button data-tab="home" class="on"><span class="ico">◎</span>홈</button>
    <button data-tab="list"><span class="ico">≣</span>내역</button>
    <div style="flex:1"></div>
    <button data-tab="stats"><span class="ico">◔</span>통계</button>
    <button data-tab="settings"><span class="ico">⚙</span>설정</button>
    <button class="fab" id="fab">+</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ storage ============ */
const store = (() => {
  const KEY = 'ledger_v1';
  let usingLS = true, mem = null;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ usingLS = false; }
  return {
    load(){ if(usingLS){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } } return mem; },
    save(d){ if(usingLS){ try{ localStorage.setItem(KEY, JSON.stringify(d)); return; }catch(e){ usingLS=false; } } mem = d; },
    get persistent(){ return usingLS; }
  };
})();

/* ============ helpers ============ */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const won = n => '₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');
const plain = n => Math.round(n).toLocaleString('ko-KR');
const shortWon = n => { n=Math.round(n); if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억'; if(n>=10000) return (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'만'; return plain(n); };
function localDate(d=new Date()){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
const ymOf = ds => ds.slice(0,7);
function addMonth(ym,delta){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function daysInMonth(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
const DOW = ['일','월','화','수','목','금','토'];
const CATPAL = ['#E4B363','#6FBF9B','#5B8DEF','#E06B5E','#C08CE0','#E8955B','#5FC7C7','#B8C05B','#E07EB0','#8C9BE0','#7FBF6F'];

/* ============ state ============ */
function defaults(){
  return {
    version:2,
    settings:{ monthlyBudget: 500000 },
    payments:[
      {id:uid(), name:'아빠카드', kind:'card', billingDay:null},
      {id:uid(), name:'국민카드', kind:'check', billingDay:null},
      {id:uid(), name:'신용카드', kind:'credit', billingDay:10},
    ],
    categories:[
      {id:'c_food', name:'식비', icon:'🍚'},
      {id:'c_cafe', name:'카페/간식', icon:'☕', waste:true},
      {id:'c_deli', name:'배달', icon:'🛵', waste:true},
      {id:'c_trans', name:'교통', icon:'🚌'},
      {id:'c_shop', name:'쇼핑', icon:'🛍️', waste:true},
      {id:'c_life', name:'생활', icon:'🧴'},
      {id:'c_cult', name:'문화/여가', icon:'🎮', waste:true},
      {id:'c_comm', name:'통신', icon:'📱'},
      {id:'c_sub', name:'구독', icon:'📺'},
      {id:'c_home', name:'주거/공과금', icon:'🏠'},
      {id:'c_med', name:'의료', icon:'💊'},
      {id:'c_etc', name:'기타', icon:'📦'},
    ],
    incomeCats:[
      {id:'i_allow', name:'용돈', icon:'💸'},
      {id:'i_sal', name:'급여', icon:'🪖'},
      {id:'i_etc', name:'기타수입', icon:'➕'},
    ],
    recurring:[],
    txns:[]
  };
}
let state = store.load() || defaults();
if(!state.recurring) state.recurring=[];
let viewMonth = localDate().slice(0,7);
let tab = 'home';
let statsPeriod = 'month';
function persist(){ store.save(state); }

const catById = id => state.categories.find(c=>c.id===id) || state.incomeCats.find(c=>c.id===id) || {name:'기타', icon:'📦'};
const payById = id => state.payments.find(p=>p.id===id) || {name:'-'};
const catColor = id => { const i=state.categories.findIndex(c=>c.id===id); return CATPAL[(i<0?0:i)%CATPAL.length]; };
const payColor = id => { const i=state.payments.findIndex(p=>p.id===id); return CATPAL[(i<0?0:i)%CATPAL.length]; };
const txnsIn = ym => state.txns.filter(t=>ymOf(t.date)===ym);
const sumExp = arr => arr.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
const sumInc = arr => arr.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);

/* ============ recurring auto-post ============ */
function postRecurring(){
  const cm = localDate().slice(0,7);
  const today = new Date().getDate();
  let posted=0;
  state.recurring.forEach(r=>{
    if(!r.active || r.lastPosted===cm) return;
    const dd = Math.min(r.day, daysInMonth(cm));
    if(today>=dd){
      state.txns.push({ id:uid(), type:'expense', amount:r.amount, date:cm+'-'+String(dd).padStart(2,'0'),
        categoryId:r.categoryId, paymentMethodId:r.paymentMethodId, memo:r.name, recurringId:r.id });
      r.lastPosted=cm; posted++;
    }
  });
  if(posted) persist();
  return posted;
}

/* ============ signals ============ */
function pace(ym){
  const budget = state.settings.monthlyBudget||0;
  const spent = sumExp(txnsIn(ym));
  const dim = daysInMonth(ym);
  const isCur = ym===localDate().slice(0,7);
  const today = new Date().getDate();
  const remainDays = isCur ? Math.max(dim - today + 1, 1) : 0;
  const remainBudget = budget - spent;
  const perDay = (isCur && remainDays>0) ? remainBudget/remainDays : 0;
  return {budget, spent, dim, isCur, remainDays, remainBudget, perDay};
}
function noSpendStreak(){
  const exp = new Set(state.txns.filter(t=>t.type==='expense').map(t=>t.date));
  let streak=0, d=new Date();
  while(streak<400){ const ds=localDate(d); if(exp.has(ds)) break; streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function noSpendThisMonth(ym){
  const exp = new Set(txnsIn(ym).filter(t=>t.type==='expense').map(t=>t.date));
  const isCur = ym===localDate().slice(0,7);
  const days = isCur ? new Date().getDate() : daysInMonth(ym);
  let c=0; for(let i=1;i<=days;i++){ if(!exp.has(ym+'-'+String(i).padStart(2,'0'))) c++; }
  return c;
}
function wasteWatch(ym){
  const wc = new Set(state.categories.filter(c=>c.waste).map(c=>c.id));
  const cur = txnsIn(ym).filter(t=>t.type==='expense'&&wc.has(t.categoryId)).reduce((s,t)=>s+t.amount,0);
  const dim = daysInMonth(ym), isCur = ym===localDate().slice(0,7);
  const elapsed = isCur ? new Date().getDate() : dim;
  const projected = elapsed>0 ? cur/elapsed*dim : cur;
  let sums=[], mm=ym;
  for(let i=0;i<3;i++){ mm=addMonth(mm,-1); if(txnsIn(mm).length){ sums.push(txnsIn(mm).filter(t=>t.type==='expense'&&wc.has(t.categoryId)).reduce((s,t)=>s+t.amount,0)); } }
  const avg = sums.length ? sums.reduce((a,b)=>a+b,0)/sums.length : null;
  return {cur, projected, avg, over: avg!=null && projected>avg*1.15};
}
function cardBill(pay, ym){
  if(pay.kind!=='credit'||!pay.billingDay) return null;
  const thisUse = txnsIn(ym).filter(t=>t.type==='expense'&&t.paymentMethodId===pay.id).reduce((s,t)=>s+t.amount,0);
  const prevUse = txnsIn(addMonth(ym,-1)).filter(t=>t.type==='expense'&&t.paymentMethodId===pay.id).reduce((s,t)=>s+t.amount,0);
  return {day:pay.billingDay, thisUse, prevUse};
}

/* ============ home ============ */
function viewHome(){
  const cm=localDate().slice(0,7);
  const p = pace(viewMonth);
  const pct = p.budget>0 ? Math.min(p.spent/p.budget*100,100) : 0;
  const gc = pct<70?'var(--good)':pct<100?'var(--warn)':'var(--bad)';
  const inc = sumInc(txnsIn(viewMonth));
  const streak = noSpendStreak();
  const nsMonth = noSpendThisMonth(viewMonth);
  const ww = wasteWatch(viewMonth);
  const credits = state.payments.map(pp=>({pp,b:cardBill(pp,viewMonth)})).filter(x=>x.b);
  const recActive = state.recurring.filter(r=>r.active);
  const recTotal = recActive.reduce((s,r)=>s+r.amount,0);

  let signals = '';
  if(ww.over) signals += `<div class="pill alert"><div class="t">⚠ 낭비 경보</div><div class="v num">${won(ww.projected)}</div><div class="n">이 속도면 이달 예상 · 평소 ${shortWon(ww.avg)}원</div></div>`;
  else if(ww.avg!=null) signals += `<div class="pill"><div class="t">☕ 낭비성 지출</div><div class="v num">${won(ww.cur)}</div><div class="n">평소 대비 안정적</div></div>`;
  if(recActive.length) signals += `<div class="pill fixed" data-goto2="rec"><div class="t">🔁 고정비</div><div class="v num">${won(recTotal)}</div><div class="n">매달 ${recActive.length}건${p.budget>0?' · 예산의 '+Math.round(recTotal/p.budget*100)+'%':''}</div></div>`;

  const maxM=Math.max(...months.map(x=>x.v),1);

  const deltaTxt = prev===0 ? '전월 데이터 없음' : `전월 대비 <span style="color:${dcol}" class="num">${diff>0?'▲':'▼'} ${won(Math.abs(diff))}${dpct!=null?` (${Math.abs(dpct)}%)`:''}</span>`;

    <div class="box"><div class="l">${Number(addMonth(viewMonth,-1).split('-')[1])}월</div><div class="n num">${shortWon(prev)}</div></div>
    <div class="box"><div class="l">${Number(viewMonth.split('-')[1])}월</div><div class="n num" style="color:var(--gold)">${shortWon(exp)}</div></div>
  </div><div class="delta">${deltaTxt}</div></div>`;
}

    <div class="split-lg"><span class="s"><span class="dot" style="background:var(--blue)"></span>고정 <b class="num">${shortWon(fixed)}</b></span>

  ${fvCard}
  <div class="card"><h3>카테고리 순위 (탭하면 상세)</h3>${catBars}</div>`;

function donutSVG(segs, total){
  const r=52, C=2*Math.PI*r, cx=64, cy=64; let off=0;
  const circles=segs.map(s=>{ const frac=s.v/total; const dash=frac*C;
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}" stroke-width="20" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=dash; return el; }).join('');
  return `<div style="position:relative; width:128px; height:128px; flex:0 0 auto">
    <svg width="128" height="128" viewBox="0 0 128 128"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0d1512" stroke-width="20"/>${circles}</svg>
    <div style="position:absolute; inset:0; display:grid; place-items:center"><div class="donut-center">총 지출<b class="num">${shortWon(total)}</b></div></div></div>`;
}

function wireSheet(isEdit){
  const sh=$('#sheet');

  $$('[data-k]',sh).forEach(b=>b.onclick=()=>{

    draft.amount=Math.min(Number(s),1e12);
    const disp=$('.amtdisp',sh); disp.textContent=(draft.amount?(draft.type==='income'?'+':'')+won(draft.amount):'₩0');

  });
  $$('[data-cat]',sh).forEach(b=>b.onclick=()=>{ draft.categoryId=b.dataset.cat; renderSheet(isEdit); });
  $$('[data-pay]',sh).forEach(b=>b.onclick=()=>{ draft.paymentMethodId=b.dataset.pay; renderSheet(isEdit); });
  $('#dateIn',sh).onchange=e=>draft.date=e.target.value;
  $('#memoIn',sh).oninput=e=>draft.memo=e.target.value;
  $('#saveTxn').onclick=()=>{
    if(!(draft.amount>0)) return;
    draft.memo=($('#memoIn',sh).value||'').trim();
    const i=state.txns.findIndex(t=>t.id===draft.id);
    if(i>=0) state.txns[i]=draft; else state.txns.push(draft);
    persist(); closeSheet(); render(); toast(isEdit?'수정했어요':'저장했어요');
  };
  if(isEdit) $('#delTxn').onclick=()=>{ state.txns=state.txns.filter(t=>t.id!==draft.id); persist(); closeSheet(); render(); toast('삭제했어요'); };
}

/* ============ payment form ============ */
function payFormSheet(editId){
  const p = editId ? state.payments.find(x=>x.id===editId) : {id:uid(),name:'',kind:'card',billingDay:10};
  const d={...p};
  const kinds=[['card','카드'],['check','체크'],['credit','신용'],['cash','현금']];
  function draw(){
    $('#sheet').innerHTML=`<div class="grip"></div><h3>${editId?'결제수단 편집':'결제수단 추가'}</h3>
      <div class="flabel">이름</div><input class="finput" id="pn" placeholder="예: 토스카드" value="${esc(d.name)}" style="width:100%">
      <div class="flabel">종류</div><div class="chips">${kinds.map(k=>`<button class="chip ${d.kind===k[0]?'on':''}" data-pk="${k[0]}">${k[1]}</button>`).join('')}</div>
      ${d.kind==='credit'?`<div class="flabel">결제일 (매달)</div><div class="frow"><input class="finput num" id="pbd" type="number" min="1" max="31" value="${d.billingDay||10}"><span style="align-self:center;color:var(--muted)">일</span></div>`:''}
      <button class="save-btn" id="savePay">저장</button>`;
    $$('[data-pk]').forEach(b=>b.onclick=()=>{ d.kind=b.dataset.pk; if(d.kind==='credit'&&!d.billingDay)d.billingDay=10; draw(); });
    $('#savePay').onclick=()=>{
      d.name=($('#pn').value||'').trim(); if(!d.name){ toast('이름을 입력하세요'); return; }
      if(d.kind==='credit') d.billingDay=Math.min(Math.max(Number($('#pbd').value)||10,1),31); else d.billingDay=null;
      const i=state.payments.findIndex(x=>x.id===d.id);
      if(i>=0) state.payments[i]=d; else state.payments.push(d);
      persist(); closeSheet(); render();
    };
  }
  draw(); openSheetShell();
}

/* ============ category form ============ */
const EMOJI=['🍚','☕','🛵','🚌','🛍️','🧴','🎮','📱','📺','🏠','💊','📦','🍺','⛽','✈️','🎁','📚','💇','🐶','💪','🎬','🥤'];
function catFormSheet(){
  const d={id:uid(),name:'',icon:'📦',waste:false};
  $('#sheet').innerHTML=`<div class="grip"></div><h3>카테고리 추가</h3>
    <div class="flabel">이름</div><input class="finput" id="cn" placeholder="예: 반려동물" style="width:100%">
    <div class="flabel">아이콘</div><div class="chips" id="emo">${EMOJI.map(e=>`<button class="chip" data-e="${e}" style="min-width:44px;justify-content:center">${e}</button>`).join('')}</div>
    <div class="flabel">옵션</div><div class="chips"><button class="chip" id="wf">⚠ 낭비추적 대상</button></div>
    <button class="save-btn" id="saveCat">추가</button>`;
  $$('#emo [data-e]').forEach(b=>b.onclick=()=>{ d.icon=b.dataset.e; $$('#emo .chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  $('#wf').onclick=()=>{ d.waste=!d.waste; $('#wf').classList.toggle('on',d.waste); };
  $('#saveCat').onclick=()=>{ d.name=($('#cn').value||'').trim(); if(!d.name){toast('이름을 입력하세요');return;} state.categories.push(d); persist(); closeSheet(); render(); };
  openSheetShell();
}

/* ============ recurring form ============ */
function recFormSheet(editId){
  const r = editId ? state.recurring.find(x=>x.id===editId) : {id:uid(),name:'',amount:0,categoryId:(state.categories.find(c=>c.id==='c_sub')||state.categories[0]).id,paymentMethodId:state.payments[0].id,day:1,active:true,lastPosted:null};
  const d={...r};
  function draw(){
    const catChips=state.categories.map(c=>`<button class="chip ${c.id===d.categoryId?'on':''}" data-rc="${c.id}">${c.icon||''} ${esc(c.name)}</button>`).join('');
    const payChips=state.payments.map(p=>`<button class="chip ${p.id===d.paymentMethodId?'on':''}" data-rp="${p.id}">${esc(p.name)}</button>`).join('');
    $('#sheet').innerHTML=`<div class="grip"></div><h3>${editId?'반복지출 편집':'반복지출 추가'}</h3>
      <div class="flabel">이름</div><input class="finput" id="rn" placeholder="예: 넷플릭스, 통신비" value="${esc(d.name)}" style="width:100%">
      <div class="flabel">금액</div><input class="finput money" id="ra" inputmode="numeric" value="${d.amount?plain(d.amount):''}" placeholder="0" style="width:100%">
      <div class="flabel">결제일 (매달)</div><div class="frow"><input class="finput num" id="rd" type="number" min="1" max="31" value="${d.day}"><span style="align-self:center;color:var(--muted)">일</span></div>
      <div class="flabel">카테고리</div><div class="chips">${catChips}</div>
      <div class="flabel">결제수단</div><div class="chips">${payChips}</div>
      <div class="flabel">상태</div><div class="chips"><button class="chip ${d.active?'on':''}" id="ract">${d.active?'✓ 사용 중':'일시정지됨'}</button></div>
      <button class="save-btn" id="saveRec">저장</button>
      ${editId?'<button class="del-btn" id="delRec">삭제</button>':''}
      <div style="text-align:center;color:var(--faint);font-size:11.5px;margin-top:10px;line-height:1.5">결제일이 지나면 앱을 열 때 자동으로 이번 달 내역에 등록돼요.</div>`;
    $('#ra').oninput=e=>{ const v=e.target.value.replace(/[^\d]/g,''); e.target.value=v?Number(v).toLocaleString('ko-KR'):''; d.amount=Number(v)||0; };
    $('#rd').oninput=e=>d.day=Math.min(Math.max(Number(e.target.value)||1,1),31);
    $$('[data-rc]').forEach(b=>b.onclick=()=>{ d.categoryId=b.dataset.rc; draw(); });
    $$('[data-rp]').forEach(b=>b.onclick=()=>{ d.paymentMethodId=b.dataset.rp; draw(); });
    $('#ract').onclick=()=>{ d.active=!d.active; draw(); };
    $('#saveRec').onclick=()=>{
      d.name=($('#rn').value||'').trim(); if(!d.name){toast('이름을 입력하세요');return;}
      if(!(d.amount>0)){toast('금액을 입력하세요');return;}
      const i=state.recurring.findIndex(x=>x.id===d.id);
      if(i>=0) state.recurring[i]=d; else state.recurring.push(d);
      const n=postRecurring(); persist(); closeSheet(); render(); toast(n?'저장 · 이번 달 자동 등록됨':'저장했어요');
    };
    if(editId) $('#delRec').onclick=()=>{ if(confirm('이 반복지출을 삭제할까요? 이미 등록된 내역은 유지됩니다.')){ state.recurring=state.recurring.filter(x=>x.id!==d.id); persist(); closeSheet(); render(); }};
  }
  draw(); openSheetShell();
}

/* ============ settings ============ */
function viewSettings(){
  const kindTag={card:'카드', check:'체크', credit:'신용', cash:'현금'};
  const pays=state.payments.map(p=>`<div class="set-row">
    <div class="sw" style="background:${payColor(p.id)}"></div><div class="name">${esc(p.name)}</div>
    <span class="tag">${kindTag[p.kind]||''}${p.kind==='credit'&&p.billingDay?' '+p.billingDay+'일':''}</span>
    <button class="x" data-editpay="${p.id}">✎</button>${state.payments.length>1?`<button class="x" data-delpay="${p.id}">×</button>`:''}
  </div>`).join('');
  const recs = state.recurring.length ? state.recurring.map(r=>`<div class="set-row">
    <button class="sw" style="background:${r.active?'var(--good)':'var(--faint)'}" data-togrec="${r.id}"></button>
    <div class="name">${esc(r.name)} <span style="color:var(--muted);font-weight:500">· 매달 ${r.day}일</span></div>
    <span class="tag num">${shortWon(r.amount)}</span>
    <button class="x" data-editrec="${r.id}">✎</button><button class="x" data-delrec="${r.id}">×</button>
  </div>`).join('') : '<div style="color:var(--faint);font-size:13px;padding:4px 6px 10px">구독·통신비·월세처럼 매달 나가는 돈을 등록하면 자동으로 기록돼요.</div>';
  const cats=state.categories.map(c=>`<div class="set-row">
    <div style="width:34px;height:34px;background:var(--surface2);border-radius:9px;display:grid;place-items:center;flex:0 0 auto">${c.icon||'📦'}</div>
    <div class="name">${esc(c.name)}</div>${c.waste?'<span class="tag">낭비추적</span>':''}<button class="x" data-delcat="${c.id}">×</button>
  </div>`).join('');
  return `
  <div class="set-group"><div class="gh">월 예산</div>
    <div class="budget-in"><span style="color:var(--muted);font-size:20px">₩</span>
      <input id="budgetIn" type="text" inputmode="numeric" value="${plain(state.settings.monthlyBudget)}"></div></div>
  <div class="set-group"><div class="gh">반복지출 (고정비)</div>${recs}
    <button class="set-add" id="addRec">+ 반복지출 추가</button></div>
  <div class="set-group"><div class="gh">결제수단</div>${pays}
    <button class="set-add" id="addPay">+ 결제수단 추가</button></div>
  <div class="set-group"><div class="gh">지출 카테고리</div>${cats}
    <button class="set-add" id="addCat">+ 카테고리 추가</button></div>
  <div class="set-group"><div class="gh">데이터</div>
    <div class="databtn"><button id="exportBtn">내보내기 (백업)</button><button id="importBtn">가져오기</button></div>
    <div style="margin-top:8px"><button class="set-add danger" id="resetBtn" style="border-color:rgba(224,107,94,.3)">전체 초기화</button></div></div>
  <div style="text-align:center;color:var(--faint);font-size:11.5px;margin-top:18px">
    ${store.persistent?'데이터는 이 기기에만 저장됩니다.':'미리보기 모드 · 배포 후 자동 저장'}<br>정기적으로 내보내기로 백업하세요.</div>`;
}

/* ============ data ============ */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`장부백업_${localDate()}.json`; a.click(); URL.revokeObjectURL(a.href); toast('백업 파일을 저장했어요');
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.txns||!d.payments) throw 0; if(!d.recurring) d.recurring=[];
      state=d; persist(); render(); toast('데이터를 불러왔어요'); }catch(_){ toast('올바른 백업 파일이 아니에요'); } };
    r.readAsText(f); };
  inp.click();
}

/* ============ wiring ============ */
function wire(){
  $$('[data-goto]').forEach(a=>a.onclick=()=>{ tab=a.dataset.goto; render(); });
  $$('[data-goto2="rec"]').forEach(a=>a.onclick=()=>{ tab='settings'; render(); });
  $$('[data-edit]').forEach(r=>r.onclick=()=>openSheet(r.dataset.edit));
  $$('[data-sp]').forEach(b=>b.onclick=()=>{ statsPeriod=b.dataset.sp; render(); });
  $$('[data-catdetail]').forEach(el=>el.onclick=()=>categoryDetailSheet(el.dataset.catdetail));
  if(tab==='settings'){
    $('#budgetIn').oninput=e=>{ let v=e.target.value.replace(/[^\d]/g,''); e.target.value=v?Number(v).toLocaleString('ko-KR'):''; state.settings.monthlyBudget=Number(v)||0; persist(); };
    $('#addRec').onclick=()=>recFormSheet(null);
    $$('[data-editrec]').forEach(b=>b.onclick=()=>recFormSheet(b.dataset.editrec));
    $$('[data-delrec]').forEach(b=>b.onclick=()=>{ if(confirm('이 반복지출을 삭제할까요?')){ state.recurring=state.recurring.filter(r=>r.id!==b.dataset.delrec); persist(); render(); }});
    $$('[data-togrec]').forEach(b=>b.onclick=()=>{ const r=state.recurring.find(x=>x.id===b.dataset.togrec); if(r){ r.active=!r.active; if(r.active) postRecurring(); persist(); render(); }});
    $('#addPay').onclick=()=>payFormSheet(null);
    $('#addCat').onclick=()=>catFormSheet();
    $$('[data-editpay]').forEach(b=>b.onclick=()=>payFormSheet(b.dataset.editpay));
    $$('[data-delpay]').forEach(b=>b.onclick=()=>{ if(confirm('이 결제수단을 삭제할까요? 기존 내역은 유지됩니다.')){ state.payments=state.payments.filter(p=>p.id!==b.dataset.delpay); persist(); render(); }});
    $$('[data-delcat]').forEach(b=>b.onclick=()=>{ if(confirm('이 카테고리를 삭제할까요?')){ state.categories=state.categories.filter(c=>c.id!==b.dataset.delcat); persist(); render(); }});
    $('#exportBtn').onclick=exportData; $('#importBtn').onclick=importData;
    $('#resetBtn').onclick=()=>{ if(confirm('모든 데이터를 지우고 처음 상태로 되돌립니다. 계속할까요?')){ state=defaults(); persist(); render(); }};
  }
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$$('nav button[data-tab]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; if(tab!=='stats') statsPeriod='month'; render(); });
$('#fab').onclick=()=>openSheet(null);
function step(dir){ if(tab==='stats'&&statsPeriod==='year') viewMonth=addMonth(viewMonth,dir*12); else viewMonth=addMonth(viewMonth,dir); render(); }
$('#prevM').onclick=()=>step(-1);
$('#nextM').onclick=()=>step(1);
$('#sheetBg').onclick=closeSheet;

try{
  const mani={ name:'장부 가계부', short_name:'장부', display:'standalone', background_color:'#0E1613', theme_color:'#0E1613', start_url:'.', icons:[] };
  const l=document.createElement('link'); l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(mani)],{type:'application/json'}));
  document.head.appendChild(l);
}catch(e){}

const autoPosted = postRecurring();
render();
if(autoPosted) toast(`고정비 ${autoPosted}건 자동 등록됨`);
</script>
</body>
</html>
